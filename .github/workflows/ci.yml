name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # URL fictícia apenas para o build — o app não se conecta em build time.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/build_dummy
